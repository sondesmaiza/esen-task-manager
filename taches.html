<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESEN - Liste des Tâches</title>
    <link rel="stylesheet" href="style4.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="menu-container">
        <button class="menu-dots" id="menuBtn">⋮</button>
        <div class="dropdown-menu" id="dropdown">
            <div class="setting-item">
                <span>🎵 Musique</span>
                <label class="switch">
                    <input type="checkbox" id="music-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>🌙 Mode Sombre</span>
                <label class="switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <header class="main-header">
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="inscription.html" target="_blank">Inscription</a></li>
                <li><a href="ajouter.html">Ajouter</a></li>
                <li><a href="taches.html">Tâches</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-center">
        <div class="form-container-full">
            <h2 class="form-title shadow-effect">Liste des tâches</h2>
            
            <div id="tasks-display">
                </div>

            <div class="form-actions">
                <button type="button" class="btn-submit" onclick="alert('Opération Validée !')">Valider</button>
                <button type="button" class="btn-cancel" onclick="window.location.href='ajouter.html'">Annuler</button>
            </div>
        </div>
    </main>

    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script src="app4.js"></script>
</body>
</html>
