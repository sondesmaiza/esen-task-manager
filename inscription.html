<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESEN Task Manager - Connexion</title>
    <link rel="stylesheet" href="style2.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="menu-container">
        <button class="menu-dots" id="menuBtn">⋮</button>
        <div class="dropdown-menu" id="dropdown">
            <div class="setting-item">
                <span>🎵 Musique</span>
                <label class="switch">
                    <input type="checkbox" id="music-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>🌙 Mode Sombre</span>
                <label class="switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <header class="main-header">
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="inscription.html">Inscription</a></li>
                <li><a href="ajouter.html">Ajouter</a></li>
                <li><a href="taches.html">Tâches</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-center">
        <div class="hero-card" id="login-section">
            <h1 class="title shadow-effect">Connexion</h1>
            
            <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='ajouter.html';">
                <input type="text" placeholder="Nom d'utilisateur" required>
                <input type="password" placeholder="Mot de passe" required>
                <button type="submit" class="btn-start">Se connecter</button>
            </form>
            
            <p class="description shadow-effect" style="margin-top: 20px; font-size: 1.1rem;">
                Pas encore de compte ? <span id="go-to-register" class="link-auth">Cliquer ici</span>
            </p>
        </div>

        <div class="hero-card" id="register-section" style="display: none;">
            <h1 class="title shadow-effect">Créer un compte</h1>
            
            <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='ajouter.html';">
                <input type="text" placeholder="Email ou Téléphone" required>
                <input type="password" placeholder="Mot de passe" required>
                <input type="password" placeholder="Confirmer le mot de passe" required>
                <button type="submit" class="btn-start">Valider</button>
            </form>
            
            <p class="description shadow-effect" style="margin-top: 20px; font-size: 1.1rem;">
                Déjà inscrit ? <span id="go-to-login" class="link-auth">Se connecter</span>
            </p>
        </div>
    </main>

    <audio id="bg-music" loop>
        <source src="c:\Users\Admin\Desktop\projet programmation web\music.mp3" type="audio/mpeg">
    </audio>

    <script src="app2.js"></script>
</body>
</html>
