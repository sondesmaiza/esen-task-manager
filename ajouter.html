<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESEN - Ajouter une Tâche</title>
    <link rel="stylesheet" href="style3.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="menu-container">
        <button class="menu-dots" id="menuBtn">⋮</button>
        <div class="dropdown-menu" id="dropdown">
            <div class="setting-item">
                <span>🎵 Musique</span>
                <label class="switch">
                    <input type="checkbox" id="music-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>🌙 Mode Sombre</span>
                <label class="switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <header class="main-header">
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="inscription.html" target="_blank">Inscription</a></li>
                <li><a href="ajouter.html">Ajouter</a></li>
                <li><a href="taches.html">Tâches</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-center">
        <div class="form-container-full">
            <h2 class="form-title shadow-effect">Nouvelle Tâche</h2>
            <form id="task-form" novalidate> 
                <div class="input-group">
                    <label for="nom-user">Votre Nom</label>
                    <input type="text" id="nom-user" placeholder="Entrez votre nom">
                    <span class="error-msg"></span>
                </div>

                <div class="input-group">
                    <label for="nom-tache">Nom de la tâche</label>
                    <input type="text" id="nom-tache" placeholder="Que faut-il faire ?">
                    <span class="error-msg"></span>
                </div>
                
                <div class="priority-section">
                    <p class="label-text">Priorité :</p>
                    <div class="priority-options">
                        <label class="prio-btn urgent">
                            <input type="radio" name="priority" value="Urgente" checked>
                            <span>Urgente</span>
                        </label>
                        <label class="prio-btn moyenne">
                            <input type="radio" name="priority" value="Moyenne">
                            <span>Moyenne</span>
                        </label>
                        <label class="prio-btn faible">
                            <input type="radio" name="priority" value="Faible">
                            <span>Faible</span>
                        </label>
                    </div>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label for="date-tache">Date</label>
                        <input type="date" id="date-tache">
                        <span class="error-msg"></span>
                    </div>
                    <div class="input-group">
                        <label for="duree-tache">Durée (h)</label>
                        <input type="number" id="duree-tache" placeholder="ex: 2" min="1">
                        <span class="error-msg"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit">Ajouter</button>
                    <button type="reset" class="btn-cancel">Annuler</button>
                </div>
            </form>
        </div>
    </main>

    <audio id="bg-music" loop>
        <source src="c:\Users\Admin\Desktop\projet programmation web\music.mp3" type="audio/mpeg">
    </audio>

    <script src="app3.js"></script>
</body>
</html>
