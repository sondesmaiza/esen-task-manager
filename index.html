<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESEN Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="menu-container">
        <button class="menu-dots" id="menuBtn">⋮</button>
        <div class="dropdown-menu" id="dropdown">
            <div class="setting-item">
                <span>🎵 Musique</span>
                <label class="switch">
                    <input type="checkbox" id="music-toggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-item">
                <span>🌙 Mode Sombre</span>
                <label class="switch">
                    <input type="checkbox" id="dark-mode-toggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <header class="main-header">
        <nav>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="inscription.html" target="_blank">Inscription</a></li>
                <li><a href="ajouter.html">Ajouter</a></li>
                <li><a href="taches.html">Tâches</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-center">
        <div class="hero-card">
            <div class="logo-container">
                <img src="c:\Users\Admin\Desktop\projet programmation web\logo.jpg.jpg" alt="ESEN Logo" class="logo">
            </div>
            <h1 class="title shadow-effect">Welcome to ESEN Task Manager</h1>
            <p class="description shadow-effect">Organisez vos tâches, examens et idées facilement.</p>
            
            <button class="btn-start">Start</button>
        </div>
    </main>

    <audio id="bg-music" loop>
        <source src="c:\Users\Admin\Desktop\projet programmation web\music.mp3" type="audio/mpeg">
    </audio>

    <script src="app.js"></script>
</body>
</html>
